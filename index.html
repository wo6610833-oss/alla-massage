<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dr Alla · Buenos Aires</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Заголовки: Cormorant Garamond, как на флаере студии. Текст: Onest (есть кириллица) -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="preload" as="image" href="img/alla-hero-sm.jpg">
<style>
  /* Палитра «чёрный и табак»: тёплый почти-чёрный + один акцент, как свет свечей на фото.
     Радиусы: кнопки и чипы - пилюля, карточки 20px, поля 14px. */
  :root {
    --bg: #f3f1ee; --surface: #fbfaf8; --surface-2: #ebe7e2; --line: rgba(30, 24, 20, .12);
    --text: #171412; --muted: #675f57; --accent: #7f5536; --accent-ink: #fbfaf8;
    --accent-soft: rgba(127, 85, 54, .12); --danger: #b03a2e; --ok: #2f7a4a; --warn: #a3621f;
    --shadow: 0 10px 30px rgba(60, 40, 25, .10);
  }
  :root[data-theme="dark"] {
    --bg: #121110; --surface: #1c1a18; --surface-2: #262320; --line: rgba(239, 233, 225, .10);
    --text: #efe9e1; --muted: #a59b90; --accent: #cfa87f; --accent-ink: #171412;
    --accent-soft: rgba(207, 168, 127, .14); --danger: #e8816f; --ok: #7cc393; --warn: #e2a25e;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 Onest, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  body.flow { padding-bottom: 110px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  button:disabled { cursor: default; }
  a { color: inherit; text-decoration: none; }
  i.ph { font-size: 20px; line-height: 1; }
  .hidden { display: none !important; }
  .display { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; letter-spacing: -.01em; line-height: 1.05; }
  img { display: block; max-width: 100%; }
  .cover { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Главная ---------- */
  .hero { position: relative; min-height: 80dvh; display: flex; flex-direction: column; justify-content: flex-end; background: #1b1511; }
  .hero img { position: absolute; inset: 0; object-position: 50% 30%; }
  .hero::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(18,17,16,.25) 0%, rgba(18,17,16,0) 30%, rgba(18,17,16,.72) 72%, var(--bg) 100%); }
  .hero-body { position: relative; z-index: 1; padding: 0 20px 26px; color: #f5efe7; }
  :root:not([data-theme="dark"]) .hero-body { color: var(--text); }
  :root:not([data-theme="dark"]) .hero::after {
    background: linear-gradient(180deg, rgba(18,17,16,.25) 0%, rgba(18,17,16,0) 30%, rgba(243,241,238,.8) 78%, var(--bg) 100%); }
  .hero h1 { font-size: 52px; margin: 0 0 8px; }
  .hero p { margin: 0 0 20px; max-width: 30ch; font-size: 16px; opacity: .92; }
  .topbar { position: absolute; top: 14px; left: 14px; right: 14px; z-index: 2; display: flex; justify-content: space-between; gap: 8px; }
  .glass { display: flex; padding: 3px; border-radius: 999px; background: rgba(18,17,16,.45);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.14); }
  .glass button { color: #f5efe7; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 999px; letter-spacing: .04em;
    display: inline-flex; align-items: center; gap: 6px; }
  .glass button i { font-size: 15px; }
  .glass button.on { background: #f5efe7; color: #171412; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px;
    padding: 15px 22px; font-weight: 600; font-size: 16px; white-space: nowrap; transition: transform .15s ease, opacity .15s; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-sm { padding: 9px 14px; font-size: 14px; }
  .btn-block { width: 100%; }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }

  section.block { padding: 36px 20px 0; }
  .h2 { font-size: 34px; margin: 0 0 16px; }

  .about { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
  .about img { aspect-ratio: 1; border-radius: 20px; object-fit: cover; width: 100%; }
  .about p { margin: 0; color: var(--muted); }
  .creds { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .cred { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 12px; font-size: 13px; }
  .cred i { color: var(--accent); font-size: 16px; }

  .svc { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; margin-bottom: 12px; overflow: hidden;
    display: grid; grid-template-columns: 96px 1fr; }
  .svc img { width: 96px; height: 100%; min-height: 128px; object-fit: cover; }
  .svc-body { padding: 14px 14px 14px 16px; min-width: 0; }
  .svc-name { font-weight: 600; font-size: 16px; line-height: 1.3; }
  .svc-desc { color: var(--muted); font-size: 13px; margin: 3px 0 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 6px 6px 12px; font-size: 13.5px; background: var(--bg); transition: transform .15s, border-color .15s; }
  .opt b { font-weight: 600; }
  .opt .go { width: 24px; height: 24px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .opt .go i { font-size: 13px; }
  .opt:active { transform: scale(.97); border-color: var(--accent); }

  .gallery { display: flex; gap: 10px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .gallery::-webkit-scrollbar { display: none; }
  .gallery figure { margin: 0; flex: none; width: 62%; scroll-snap-align: start; }
  .gallery img { aspect-ratio: 3 / 4; border-radius: 20px; object-fit: cover; width: 100%; background: var(--surface-2); }
  .gallery figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .info { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 6px 18px; margin-top: 16px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .ic { width: 38px; height: 38px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
  .row .tx { flex: 1; min-width: 0; }
  .row small { display: block; color: var(--muted); font-size: 12.5px; }
  .row .arrow { color: var(--muted); }
  .footer-cta { padding: 28px 20px 36px; }

  /* ---------- Запись ---------- */
  .flow-top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 20px 10px; }
  .flow-nav { display: flex; align-items: center; gap: 10px; min-height: 36px; }
  .back { width: 36px; height: 36px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; flex: none; }
  .progress { display: grid; gap: 6px; flex: 1; }
  .progress span { height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; position: relative; }
  .progress span::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform: scaleX(0);
    transform-origin: left; transition: transform .35s cubic-bezier(.16,1,.3,1); }
  .progress span.done::after { transform: scaleX(1); }
  .flow-title { font-size: 32px; margin: 14px 0 0; }

  .step { padding: 4px 20px 0; }
  .enter { animation: stepIn .38s cubic-bezier(.16,1,.3,1); }
  @keyframes stepIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

  .picked { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 10px; margin-top: 8px; }
  .picked img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; flex: none; }
  .picked b { display: block; font-weight: 600; line-height: 1.25; }
  .picked small { color: var(--muted); }

  .spec-card { width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px; padding: 12px; margin-top: 10px; transition: border-color .15s, transform .15s; }
  .spec-card:active { transform: scale(.99); }
  .spec-card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .spec-card img { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; flex: none; }
  .spec-card b { display: block; font-size: 16px; }
  .spec-card small { color: var(--muted); }

  .label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 24px 0 10px; display: flex; align-items: center; gap: 6px; }
  .label.err { color: var(--danger); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -20px; padding: 2px 20px 6px; scroll-snap-type: x proximity; scroll-padding-inline: 20px; scrollbar-width: none; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
    white-space: nowrap; font-weight: 500; transition: background .15s, color .15s, border-color .15s, transform .15s; }
  .chip:active:not(:disabled) { transform: scale(.96); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:disabled { opacity: .38; }
  .chip small { opacity: .7; margin-left: 6px; font-weight: 500; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 62px; padding: 10px 8px 12px; border-radius: 20px; scroll-snap-align: start; }
  .day span { font-size: 12px; opacity: .75; text-transform: capitalize; }
  .day b { font-size: 22px; font-weight: 600; line-height: 1.1; }
  .times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .times .chip { padding: 12px 0; text-align: center; }
  .empty { color: var(--muted); font-size: 14px; background: var(--surface); border: 1px dashed var(--line); border-radius: 20px; padding: 16px; }
  .skel { height: 46px; border-radius: 999px; background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .field { display: grid; gap: 6px; margin-top: 14px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .field label.err { color: var(--danger); }
  .field .hint { font-size: 12px; color: var(--muted); }
  input, textarea, select { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { min-height: 84px; resize: vertical; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
  .seg button { padding: 10px 6px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; margin-top: 8px; }
  .summary > img { height: 130px; width: 100%; object-fit: cover; object-position: 50% 30%; }
  .sum-body { padding: 4px 18px; }
  .sum-row { display: flex; gap: 12px; padding: 13px 0; align-items: flex-start; }
  .sum-row + .sum-row { border-top: 1px solid var(--line); }
  .sum-row i { color: var(--accent); margin-top: 1px; }
  .sum-row .k { font-size: 12.5px; color: var(--muted); }
  .sum-row .v { font-weight: 500; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 18px; background: var(--accent-soft); }
  .total b { font-size: 24px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; }
  .note { display: flex; gap: 10px; color: var(--muted); font-size: 13.5px; margin: 16px 0 0; align-items: flex-start; }
  .note i { color: var(--accent); }
  .edit { color: var(--accent); font-size: 13px; font-weight: 600; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, transparent, var(--bg) 30%); }
  .toast { position: fixed; left: 20px; right: 20px; bottom: 96px; z-index: 30; background: var(--text); color: var(--bg);
    padding: 12px 16px; border-radius: 14px; font-size: 14px; text-align: center; box-shadow: var(--shadow); animation: stepIn .25s ease; }

  /* ---------- Кабинет ---------- */
  .adm-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 20px 0; }
  .adm-tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px -20px 0; padding: 0 20px 10px; scrollbar-width: none; }
  .adm-tabs::-webkit-scrollbar { display: none; }
  .adm-tabs button { white-space: nowrap; padding: 8px 14px; border-radius: 999px; background: var(--surface-2); font-size: 14px; font-weight: 600; color: var(--muted); }
  .adm-tabs button.on { background: var(--accent); color: var(--accent-ink); }
  .adm { padding: 8px 20px 40px; }
  .day-h { font-size: 13px; font-weight: 600; color: var(--muted); margin: 20px 0 8px; }
  .day-h::first-letter { text-transform: uppercase; }
  .bk { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin-bottom: 10px; }
  .bk-top { display: flex; gap: 12px; align-items: baseline; }
  .bk-time { font-size: 22px; font-weight: 600; font-family: "Cormorant Garamond", Georgia, serif; min-width: 56px; }
  .bk-main { flex: 1; min-width: 0; }
  .bk-main b { display: block; }
  .bk-main small { color: var(--muted); display: block; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); display: inline-flex; align-items: center; gap: 4px; }
  .tag i { font-size: 13px; }
  .tag.ok { color: var(--ok); } .tag.new { color: var(--accent); } .tag.warn { color: var(--warn); } .tag.off { color: var(--danger); }
  .bk-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .field { margin-top: 14px; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 14px; }
  .check input { width: 20px; height: 20px; accent-color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .cl { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .cl:first-child { border-top: 0; }
  .cl .tx { flex: 1; min-width: 0; }
  .cl small { color: var(--muted); display: block; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 32px; height: 32px; border-radius: 999px; background: var(--surface-2); display: grid; place-items: center; }
  .stepper b { min-width: 22px; text-align: center; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
  .tile small { color: var(--muted); font-size: 12.5px; display: block; }
  .tile b { font-size: 30px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; line-height: 1.1; }
  .chart { position: relative; margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 8px; }
  .chart h3 { margin: 0 0 10px; font-size: 14px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid var(--line); }
  .bars button { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .bars button span { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .85; }
  .bars button:hover span, .bars button.on span { opacity: 1; }
  .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .tip { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 20px; }
  .tip b { color: var(--text); }
  .copy { display: flex; gap: 8px; margin-top: 10px; }
  .copy input { font-size: 13px; }
  ol.steps { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: 14px; }
  ol.steps li { margin: 4px 0; }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1); }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .enter, .toast, .skel { animation: none; }
    * { transition: none !important; }
  }
  @media (min-width: 640px) { #app { max-width: 560px; margin: 0 auto; } .dock { max-width: 560px; margin: 0 auto; } .gallery figure { width: 44%; } }
</style>
</head>
<body>
<div id="app">

<!-- ================= Главная ================= -->
<main id="home">
  <header class="hero">
    <img class="cover" src="img/alla-hero-sm.jpg" srcset="img/alla-hero-sm.jpg 640w, img/alla-hero.jpg 1400w" sizes="100vw" alt="Alla">
    <div class="topbar">
      <div class="glass hidden" id="adminPill"><button id="adminBtn"><i class="ph ph-squares-four"></i>Кабинет</button></div>
      <span></span>
      <div class="glass" id="langs"></div>
    </div>
    <div class="hero-body">
      <h1 class="display">Dr Alla</h1>
      <p data-t="heroSub"></p>
      <button class="btn btn-primary" id="heroCta"><i class="ph ph-calendar-plus"></i><span data-t="book"></span></button>
    </div>
  </header>

  <section class="block reveal">
    <div class="about">
      <img src="img/hands-neck-sm.jpg" alt="" loading="lazy">
      <p data-t="about"></p>
    </div>
    <div class="creds" id="creds"></div>
  </section>

  <section class="block" id="services">
    <h2 class="h2 display reveal" data-t="services"></h2>
    <div id="svcList"></div>
  </section>

  <section class="block reveal">
    <h2 class="h2 display" data-t="studio"></h2>
    <div class="gallery" id="gallery"></div>
    <div class="info">
      <a class="row" id="mapLink" target="_blank" rel="noopener">
        <span class="ic"><i class="ph ph-map-pin"></i></span>
        <span class="tx"><span id="addr"></span><small data-t="openMap"></small></span>
        <i class="ph ph-arrow-up-right arrow"></i>
      </a>
      <a class="row" id="tgLink" target="_blank" rel="noopener">
        <span class="ic"><i class="ph ph-telegram-logo"></i></span>
        <span class="tx"><span data-t="writeAlla"></span><small id="tgUser"></small></span>
        <i class="ph ph-arrow-up-right arrow"></i>
      </a>
      <a class="row" id="waLink" target="_blank" rel="noopener">
        <span class="ic"><i class="ph ph-whatsapp-logo"></i></span>
        <span class="tx"><span id="phone"></span><small>WhatsApp</small></span>
        <i class="ph ph-arrow-up-right arrow"></i>
      </a>
      <div class="row">
        <span class="ic"><i class="ph ph-wallet"></i></span>
        <span class="tx"><span id="pays"></span><small data-t="payment"></small></span>
      </div>
    </div>
  </section>

  <div class="footer-cta reveal">
    <button class="btn btn-primary btn-block" id="footCta"><i class="ph ph-calendar-plus"></i><span data-t="book"></span></button>
  </div>
</main>

<!-- ================= Запись ================= -->
<main id="flow" class="hidden">
  <div class="flow-top">
    <div class="flow-nav">
      <button class="back" id="backBtn" aria-label="Back"><i class="ph ph-arrow-left"></i></button>
      <div class="progress" id="progress"></div>
    </div>
    <h2 class="flow-title display" id="flowTitle"></h2>
  </div>

  <div class="step" id="stepSpec"><div id="specList"></div></div>

  <div class="step hidden" id="stepWhen">
    <div class="picked" id="pickedCard"></div>
    <div id="durBlock">
      <div class="label" id="lDur"><i class="ph ph-hourglass-medium"></i><span data-t="duration"></span></div>
      <div class="chips" id="durs"></div>

const CRED_ICONS = ["ph-first-aid", "ph-hand", "ph-hand-heart", "ph-person-simple-walk"];

const guess = (tg?.initDataUnsafe?.user?.language_code || navigator.language || "ru").slice(0, 2);
let lang = T[guess] ? guess : "en";
const state = { screen: "home", steps: [], step: 0, svc: null, spec: null, opt: null, date: null, time: null, pay: C.payments[0], slots: null, slotsErr: false };

const $ = (id) => document.getElementById(id);
const t = (k) => T[lang][k];
const locale = () => ({ ru: "ru-RU", es: "es-AR", en: "en-US" })[lang];
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const img = (base, sm = true) => `${base}${sm ? "-sm" : ""}.jpg`;
const specsFor = (svc) => C.specialists.filter((s) => s.enabled && s.services.includes(svc.id));
const fromIso = (s) => new Date(s + "T12:00:00");
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
async function api(path, body) {
  const r = await fetch(API + path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.status); e.status = r.status; e.code = j.error; throw e; }
  return j;
}

// ---------- Тема ----------
function applyTheme() {
  const dark = inTelegram ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (inTelegram) {
    const css = getComputedStyle(document.documentElement);
    const bg = css.getPropertyValue("--bg").trim();
    tg.setHeaderColor(bg); tg.setBackgroundColor(bg);
    if (tg.setBottomBarColor) tg.setBottomBarColor(bg);
    tg.MainButton.setParams({ color: css.getPropertyValue("--accent").trim(), text_color: css.getPropertyValue("--accent-ink").trim() });
  }
}

// ---------- Главная ----------
function renderHome() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((e) => (e.textContent = t(e.dataset.t)));
  $("name").placeholder = t("namePh"); $("tel").placeholder = t("telPh"); $("comment").placeholder = t("commentPh");
  $("addr").textContent = C.address; $("mapLink").href = C.mapUrl;
  $("phone").textContent = C.phone; $("waLink").href = C.whatsapp;
  $("tgLink").href = `https://t.me/${C.telegram}`; $("tgUser").textContent = "@" + C.telegram;
  $("pays").textContent = C.payments.join(", ");

  $("langs").replaceChildren(...["ru", "es", "en"].map((l) => {
    const b = el("button", l === lang ? "on" : "", l.toUpperCase());
    b.onclick = () => { lang = l; haptic("select"); renderAll(); };
    return b;
  }));
  $("creds").replaceChildren(...t("creds").map((c, i) => el("span", "cred", `<i class="ph ${CRED_ICONS[i]}"></i>${esc(c)}`)));
  $("gallery").replaceChildren(...GALLERY.map((g, i) =>
    el("figure", "", `<img src="${img("img/" + g)}" alt="${esc(t("gallery")[i])}" loading="lazy"><figcaption>${esc(t("gallery")[i])}</figcaption>`)));

  $("svcList").replaceChildren(...C.services.filter((s) => specsFor(s).length).map((s) => {
    const card = el("article", "svc reveal");
    card.innerHTML = `<img src="${img(s.photo)}" alt="" loading="lazy"><div class="svc-body"><div class="svc-name">${esc(s.name[lang])}</div>
      <div class="svc-desc">${esc(s.desc[lang])}</div><div class="opts"></div></div>`;
    s.options.forEach((o) => {
      const b = el("button", "opt", `<span><b>${o.min}</b> ${t("min")}, ${o.usd} USD</span><span class="go"><i class="ph ph-arrow-right"></i></span>`);
      b.onclick = () => startFlow(s, o);
      card.querySelector(".opts").append(b);
    });
    return card;
  }));
  observeReveal();
}

function observeReveal() {
  if (reduceMotion || !("IntersectionObserver" in window)) { document.querySelectorAll(".reveal").forEach((e) => e.classList.add("in")); return; }
  const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.12 });
  document.querySelectorAll(".reveal:not(.in)").forEach((e) => io.observe(e));
}

function show(screen) {
  state.screen = screen;
  ["home", "flow", "admin"].forEach((s) => $(s).classList.toggle("hidden", s !== screen));
  document.body.classList.toggle("flow", screen === "flow");
  if (screen !== "flow") { $("dock").classList.add("hidden"); if (inTelegram) tg.MainButton.hide(); }
  if (inTelegram) screen === "home" ? tg.BackButton.hide() : tg.BackButton.show();
  scrollTo(0, 0);
}

// ---------- Запись ----------
function startFlow(svc, opt) {
  haptic("impact");
  const specs = specsFor(svc);
  Object.assign(state, {
    svc, opt: opt || (svc.options.length === 1 ? svc.options[0] : null),
    spec: specs.length === 1 ? specs[0] : (specs.includes(state.spec) ? state.spec : null),
    steps: specs.length > 1 ? ["spec", "when", "contact", "review"] : ["when", "contact", "review"],
    step: 0, date: null, time: null, slots: null,
  });
  if (!$("name").value && tg?.initDataUnsafe?.user) $("name").value = tg.initDataUnsafe.user.first_name || "";
  show("flow");
  $("progress").style.gridTemplateColumns = `repeat(${state.steps.length}, 1fr)`;
  $("progress").replaceChildren(...state.steps.map(() => el("span")));
  if (state.spec) loadSlots();
  renderFlow(true);
}

function goBack() {
  haptic("select");
  if (state.screen === "admin") { show("home"); return; }
  if (state.step > 0) { state.step--; renderFlow(true); scrollTo(0, 0); return; }
  show("home");
  $("services").scrollIntoView();
}

function goNext() {
  const step = state.steps[state.step];
  if (step === "spec" && !state.spec) return fail(t("needSpec"), "specList");
  if (step === "when") {
    const miss = { lDur: !state.opt, lDate: !state.date, lTime: !state.time };
    Object.entries(miss).forEach(([id, bad]) => $(id).classList.toggle("err", bad));
    const first = Object.keys(miss).find((k) => miss[k]);
    if (first) return fail(t("needWhen"), first);
  }
  if (step === "contact") {
    const bad = !$("name").value.trim();
    $("lName").classList.toggle("err", bad);
    if (bad) { fail(t("needName"), "lName"); $("name").focus(); return; }
  }
  if (step === "review") return submit();
  haptic("impact");
  state.step++;
  renderFlow(true);
  scrollTo(0, 0);
}

function fail(msg, anchorId) {
  haptic("error");
  toast(msg);
  $(anchorId)?.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
}

// Свободное время с сервера (учитывает записи, закрытые дни и Google Календарь)
async function loadSlots() {
  if (!state.spec || !state.opt) return;
  const key = `${state.spec.id}:${state.opt.min}`;
  state.slots = null; state.slotsErr = false; state.slotsKey = key;
  renderFlow(false);
  try {
    const r = API ? await api(`/api/slots?spec=${state.spec.id}&min=${state.opt.min}`) : { slots: localSlots() };
    if (state.slotsKey !== key) return;
    state.slots = r.slots;
    if (state.date && !(state.slots[state.date] || []).includes(state.time)) state.time = null;
    if (state.date && !state.slots[state.date]) state.date = null;
    if (!state.date) state.date = Object.keys(state.slots)[0] || null;
  } catch { state.slotsErr = true; }
  renderFlow(false);
}
// Запасной вариант без сервера: сетка по длительности блока
function localSlots() {
  const out = {}, block = C.blockMinutes?.[state.opt.min] || state.opt.min + 20;
  const toM = (h) => +h.split(":")[0] * 60 + +h.split(":")[1];
  const d0 = new Date(); d0.setHours(0, 0, 0, 0);
  for (let i = 1; i < (C.daysAhead || 21); i++) {
    const d = new Date(d0); d.setDate(d0.getDate() + i);
    if (!state.spec.workDays.includes(d.getDay())) continue;
    const list = [];
    for (let m = toM(state.spec.from); m + block <= toM(state.spec.to); m += block) list.push(`${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`);
    out[iso(d)] = list;
  }
  return out;
}

function chip(html, on, onClick, cls = "", disabled = false) {
  const b = el("button", `chip ${cls} ${on ? "on" : ""}`, html);
  b.disabled = disabled;
  b.onclick = () => { haptic("select"); onClick(); renderFlow(false); };
  return b;
}

function workDates() {
  const out = [];
  const d = new Date(); d.setHours(0, 0, 0, 0);
  for (let i = 0; i < (C.daysAhead || 21); i++) {
    const x = new Date(d); x.setDate(d.getDate() + i);
    if (state.spec?.workDays.includes(x.getDay())) out.push(x);
  }
  return out;
}

function renderFlow(animate) {
  const step = state.steps[state.step];
  const s = state.svc;
  $("flowTitle").textContent = t({ spec: "stepSpec", when: "stepWhen", contact: "stepContact", review: "stepReview" }[step]);
  [...$("progress").children].forEach((p, i) => p.classList.toggle("done", i <= state.step));
  const ids = { spec: "stepSpec", when: "stepWhen", contact: "stepContact", review: "stepReview" };
  Object.entries(ids).forEach(([k, id]) => {
    const node = $(id);
    node.classList.toggle("hidden", k !== step);
    if (k === step && animate && !reduceMotion) { node.classList.remove("enter"); void node.offsetWidth; node.classList.add("enter"); }
  });

  if (step === "spec") {
    $("specList").replaceChildren(...specsFor(s).map((sp) => {
      const b = el("button", `spec-card ${state.spec === sp ? "on" : ""}`,
        `<img src="${img(sp.photo)}" alt=""><div><b>${esc(sp.name[lang])}</b><small>${esc(sp.role[lang])}</small></div>`);
      b.onclick = () => { haptic("select"); state.spec = sp; state.date = null; state.time = null; loadSlots(); goNext(); };
      return b;
    }));
  }

  if (step === "when") {
    $("pickedCard").innerHTML = `<img src="${img(s.photo)}" alt=""><div><b>${esc(s.name[lang])}</b>
      <small>${[state.spec && specsFor(s).length > 1 ? esc(state.spec.name[lang]) : "", state.opt ? `${state.opt.min} ${t("min")}, ${state.opt.usd} USD` : ""].filter(Boolean).join(" · ")}</small></div>`;
    $("durBlock").classList.toggle("hidden", s.options.length < 2);
    $("durs").replaceChildren(...s.options.map((o) =>
      chip(`${o.min} ${t("min")}<small>${o.usd} USD</small>`, state.opt === o, () => {
        if (state.opt === o) return;
        state.opt = o; $("lDur").classList.remove("err"); loadSlots();
      })));

    const wd = new Intl.DateTimeFormat(locale(), { weekday: "short" });
    const mo = new Intl.DateTimeFormat(locale(), { month: "short" });
    const has = (d) => !!state.slots?.[iso(d)]?.length;
    $("dates").replaceChildren(...workDates().map((d) =>
      chip(`<span>${wd.format(d)}</span><b>${d.getDate()}</b><span>${mo.format(d).replace(".", "")}</span>`,
        state.date === iso(d), () => {
          state.date = iso(d); $("lDate").classList.remove("err");
          if (!(state.slots?.[state.date] || []).includes(state.time)) state.time = null;
        }, "day", state.slots ? !has(d) : true)));

    let nodes;
    if (state.slotsErr) {
      const b = el("button", "btn btn-ghost btn-sm", `<i class="ph ph-arrow-clockwise"></i>${esc(t("retry"))}`);
      b.onclick = loadSlots;
      const box = el("div", "empty", esc(t("loadFail")) + "<br><br>"); box.append(b); nodes = [box];
    } else if (!state.slots) {
      const g = el("div", "times"); for (let i = 0; i < 6; i++) g.append(el("div", "skel")); nodes = [g];
    } else if (!Object.keys(state.slots).length) {
      nodes = [el("div", "empty", esc(t("noSlots")))];
    } else if (!state.date) {
      nodes = [el("div", "empty", esc(t("pickDate")))];
    } else {
      const g = el("div", "times");
      (state.slots[state.date] || []).forEach((h) => g.append(chip(h, state.time === h, () => { state.time = h; $("lTime").classList.remove("err"); })));
      nodes = [g];
    }
    $("times").replaceChildren(...nodes);
  }

  if (step === "contact") {
    $("paySeg").replaceChildren(...C.payments.map((p) => {
      const b = el("button", state.pay === p ? "on" : "", p);
      b.onclick = () => { haptic("select"); state.pay = p; renderFlow(false); };
      return b;
    }));
  }

  if (step === "review") {
    const when = new Intl.DateTimeFormat(locale(), { weekday: "long", day: "numeric", month: "long" }).format(fromIso(state.date));
    const go = (k) => state.steps.indexOf(k);
    const row = (icon, k, v, g) => `<div class="sum-row"><i class="ph ${icon}"></i><div style="flex:1"><div class="k">${esc(k)}</div>
      <div class="v">${v}</div></div>${g >= 0 ? `<button class="edit" data-go="${g}">${esc(t("change"))}</button>` : ""}</div>`;
    const tel = $("tel").value.trim();
    $("summary").innerHTML = `<img src="${img(state.spec?.photo || "img/alla-hero")}" alt=""><div class="sum-body">
      ${row("ph-hand-heart", t("sService"), `${esc(s.name[lang])}, ${state.opt.min} ${t("min")}`, go("when"))}
      ${specsFor(s).length > 1 ? row("ph-user-circle", t("sSpec"), esc(state.spec.name[lang]), go("spec")) : ""}
      ${row("ph-calendar-check", t("sWhen"), `${esc(when)}, ${state.time}`, go("when"))}
      ${row("ph-user", t("sWho"), esc($("name").value.trim()) + (tel ? `<br><span style="color:var(--muted)">${esc(tel)}</span>` : ""), go("contact"))}
      ${row("ph-wallet", t("sPay"), esc(state.pay), go("contact"))}
      ${row("ph-map-pin", t("sWhere"), esc(C.address), -1)}
      </div><div class="total"><span>${esc(t("total"))}</span><b>${state.opt.usd} USD</b></div>`;
    $("summary").querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { state.step = +b.dataset.go; renderFlow(true); scrollTo(0, 0); }));
    const pn = $("prepayNote");
    pn.classList.toggle("hidden", !C.prepay?.enabled);
    pn.querySelector("span").textContent = C.prepay?.enabled ? t("prepayNote")(C.prepay.usd) : "";
  }

  // Главная кнопка: в Telegram нативная, в браузере своя. На шаге выбора специалиста не нужна
  const label = step === "review" ? `${t("send")}, ${state.opt.usd} USD` : t("next");
  const needBtn = step !== "spec";
  if (inTelegram) {
    tg.BackButton.show();
    tg.MainButton.setText(label);
    needBtn ? tg.MainButton.show() : tg.MainButton.hide();
    $("backBtn").classList.add("hidden");
  } else {
    $("dockBtn").innerHTML = `${esc(label)} <i class="ph ${step === "review" ? "ph-paper-plane-tilt" : "ph-arrow-right"}"></i>`;
    $("dock").classList.toggle("hidden", !needBtn);
  }
}

// ---------- Отправка ----------
async function submit() {
  const payload = {
    v: 2, l: lang, s: state.svc.id, sp: state.spec.id, m: state.opt.min, u: state.opt.usd,
    d: state.date, t: state.time, pay: state.pay,
    n: $("name").value.trim().slice(0, 80), p: $("tel").value.trim().slice(0, 40), c: $("comment").value.trim().slice(0, 600),
  };
  if (!inTelegram) { toast(t("notTg")); console.log("payload", payload); return; }
  if (!API) { haptic("success"); return tg.sendData(JSON.stringify(payload)); }
  if (submit.busy) return;
  submit.busy = true;
  tg.MainButton.showProgress();
  try {
    await api("/api/book", { initData: tg.initData, booking: payload });
    haptic("success");
    tg.close(); // подтверждение уже пришло в чат с ботом
  } catch (e) {
    haptic("error");
    if (e.status === 409) {
      toast(t("busy"));
      state.step = state.steps.indexOf("when"); state.time = null;
      loadSlots(); renderFlow(true);
    } else toast(t("sendFail"));
  } finally {
    submit.busy = false;
    tg.MainButton.hideProgress();
  }
}

function admStats(body) {
  const rows = adm.data.stats;
  const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
  const uniq = sum("appU"), books = sum("book");
  const conv = uniq ? Math.round(books / uniq * 100) : 0;
  body.append(el("p", "note", `<i class="ph ph-info"></i><span>За последние 30 дней. Ваши собственные заходы и заходы администраторов не считаются.</span>`));
  const tiles = el("div", "tiles");
  [["Заходы в приложение", sum("app")], ["Уникальные посетители", uniq], ["Заявки на запись", books], ["Конверсия в заявку", conv + "%"],
   ["Заходы на сайт", sum("site")], ["Нажали «Записаться» на сайте", sum("cta")]]
    .forEach(([k, v]) => tiles.append(el("div", "tile", `<small>${k}</small><b>${v}</b>`)));
  body.append(tiles);

  // Один ряд данных: уникальные посетители приложения и сайта по дням
  const data = rows.map((r) => ({ day: r.day, v: r.appU + r.siteU, b: r.book }));
  const max = Math.max(1, ...data.map((d) => d.v));
  const chart = el("div", "chart", `<h3>Посетители по дням</h3><div class="bars"></div><div class="axis"><span></span><span></span></div><div class="tip">Нажмите на столбик, чтобы увидеть день</div>`);
  const bars = chart.querySelector(".bars");
  const fmt = (d) => new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short" }).format(fromIso(d));
  data.forEach((d) => {
    const b = el("button", "", `<span style="height:${Math.round(d.v / max * 100)}%"></span>`);
    b.setAttribute("aria-label", `${fmt(d.day)}: ${d.v} посетителей, ${d.b} заявок`);
    const showTip = () => { bars.querySelectorAll("button").forEach((x) => x.classList.remove("on")); b.classList.add("on");
      chart.querySelector(".tip").innerHTML = `<b>${fmt(d.day)}</b>: посетителей ${d.v}, заявок ${d.b}`; };
    b.onclick = showTip; b.onmouseenter = showTip;
    bars.append(b);
  });
  const [a0, a1] = chart.querySelectorAll(".axis span");
  a0.textContent = fmt(data[0].day); a1.textContent = fmt(data.at(-1).day);
  body.append(chart);
}

      <div class="bk-actions"><button class="btn btn-sm btn-primary">Сохранить</button>${cur ? `<button class="btn btn-sm btn-danger">Отключить</button>` : ""}</div>
      <p style="margin-top:8px">${cur ? "✓ Подключено" : "Не подключено"}</p>`;
    const [save, off] = k.querySelectorAll(".bk-actions button");
    save.onclick = () => admAction({ action: "calendar", spec: sp.id, url: k.querySelector("input").value }, "Календарь подключён");
    if (off) off.onclick = () => admAction({ action: "calendar", spec: sp.id, url: "" }, "Календарь отключён");
    body.append(k);
  }
}

// ---------- Общее ----------
function toast(msg) {
  const n = $("toast");
  n.textContent = msg; n.classList.remove("hidden");
  n.style.animation = "none"; void n.offsetWidth; n.style.animation = "";
  clearTimeout(toast.tm); toast.tm = setTimeout(() => n.classList.add("hidden"), 3000);
}
function haptic(kind) {
  const h = tg?.HapticFeedback;
  if (!inTelegram || !h) return;
  if (kind === "select") h.selectionChanged();
  else if (kind === "impact") h.impactOccurred("light");
  else h.notificationOccurred(kind);
}
function renderAll() { renderHome(); if (state.screen === "flow") renderFlow(false); }

// ---------- Старт ----------
const openServices = () => { haptic("impact"); $("services").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" }); };
$("heroCta").onclick = openServices;
$("footCta").onclick = openServices;
$("backBtn").onclick = goBack;
$("admBack").onclick = goBack;
$("admReload").onclick = () => { haptic("select"); loadAdmin(); };
$("adminBtn").onclick = openAdmin;
$("dockBtn").onclick = goNext;
const openAlla = (e) => { if (!inTelegram) return; e.preventDefault(); tg.openTelegramLink(`https://t.me/${C.telegram}`); };
$("tgLink").onclick = openAlla;
document.querySelectorAll(".tg-alla").forEach((a) => { a.href = `https://t.me/${C.telegram}`; a.target = "_blank"; a.onclick = openAlla; });
applyTheme();
renderAll();
if (inTelegram) {
  tg.ready();
  tg.expand();
  tg.onEvent("themeChanged", applyTheme);
  tg.BackButton.onClick(goBack);
  tg.MainButton.onClick(goNext);
  if (API) {
    // Статистика и проверка, не администратор ли открыл приложение
    api("/api/hit", { src: "app", initData: tg.initData }).catch(() => {});
    api("/api/me", { initData: tg.initData }).then((r) => { if (r.admin) $("adminPill").classList.remove("hidden"); }).catch(() => {});
  }
} else {
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
}
</script>
</body>
