:root{

*,*::before,*::after{box-sizing:border-box}

.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gut)}

section{padding:72px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.55em;justify-content:center;white-space:nowrap;

.link{display:inline-flex;align-items:center;gap:.4em;color:var(--accent);font-weight:500;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent);padding-bottom:1px}

.bento{display:grid;gap:10px;grid-template-columns:1fr 1fr;list-style:none;margin:0;padding:0}

/* booking */
.book{background:var(--tint)}
.book .wrap{display:grid;gap:40px}
.book-side{display:grid;gap:22px;align-content:start}

/* location */

.cur{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.cur li{padding:8px 16px;border-radius:999px;background:var(--bg);font-weight:600;font-size:15px;letter-spacing:.02em}

footer{border-top:1px solid var(--line);padding:48px 0 calc(40px + env(safe-area-inset-bottom));background:var(--surface)}

.f-brand{font:600 2rem/1 var(--serif)}

/* motion */
@media (prefers-reduced-motion:no-preference){

  @keyframes up{from{opacity:0;transform:translateY(16px)}}

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
